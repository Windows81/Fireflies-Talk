<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --bg: rgba(26, 28, 34, 0.96);
      --text: #f5f7fa;
      --muted: rgba(245, 247, 250, 0.72);
      --button-primary: #6938ef;
      --button-hover: #5a2dd1;
      --menu-bg: rgba(30, 33, 40, 0.98);
      --menu-border: rgba(255, 255, 255, 0.14);
      --progress: #6ce9a6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      background: transparent;
      user-select: none;
      overflow: hidden;
      padding: 16px 17px 18px 15px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button { font-family: var(--font); cursor: pointer !important; border: none; }

    .wrap { width: 406px; height: 136px; position: relative; }

    .card {
      width: 406px;
      height: 136px;
      border-radius: 12px;
      background: var(--bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
      display: flex;
      gap: 12px;
      padding: 14px;
      position: relative;
      overflow: visible;
      transform: translateZ(0);
      animation: in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='19.299' y1='19.815' x2='-13.867' y2='-15.031' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='19.413' y1='19.707' x2='-13.752' y2='-15.139' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23FF3C82'/%3E%3Cstop offset='0.103' stop-color='%23F53E88'/%3E%3Cstop offset='0.274' stop-color='%23DC4598'/%3E%3Cstop offset='0.492' stop-color='%23B251B2'/%3E%3Cstop offset='0.745' stop-color='%237961D7'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='c' x1='24.923' y1='14.466' x2='13.685' y2='-26.259' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='d' x1='13.863' y1='24.989' x2='-26.367' y2='12.733' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23a)' d='M7.89 0H0v7.832h7.89V0Z'/%3E%3Cpath fill='url(%23b)' d='M17.236 9.455h-7.89v7.832h7.89V9.455Z'/%3E%3Cpath fill='url(%23c)' d='M17.236 0h-7.89v7.832H24v-1.12c0-1.78-.713-3.487-1.981-4.       background-repeat: no-repeat;
      background-size: 24px 24px;
      background-position: center;
    }

    .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .title { font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-size: 13px; line-height: 18px; color: var(--muted); }

    .actions { margin-top: 4px; position: relative; display: flex; align-items: flex-start; }

    .split {
      width: fit-content;
      max-width: 100%;
      height: 36px;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      background: var(--button-primary);
    }

    .primary {
      flex: 0 1 auto;
      min-width: 0;
      height: 100%;
      background: transparent;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 0 12px;
      transition: transform 0.15s ease;
    }

    #primaryText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-toggle {
      width: 42px;
      height: 100%;
      border-left: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: #fff;
      transition: transform 0.15s ease;
    }

    .split:hover { background: var(--button-hover); }
    .primary:hover, .menu-toggle:hover { transform: translateY(-1px); }
    .primary:active, .menu-toggle:active { transform: translateY(0); }

    .icon {
      width: 18px;
      height: 18px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      padding: 4px;
      border-radius: 10px;
      background: var(--menu-bg);
      border: 1px solid var(--menu-border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(20px);
      z-index: 20;
    }

    .hidden { display: none !important; }

    .menu-item {
      width: 100%;
      background: transparent;
      border-radius: 8px;
      color: var(--text);
      height: 36px;
      font-size: 14px;
      line-height: 20px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
    }

    .menu-item:hover { background: rgba(255, 255, 255, 0.08); }

    .btn-dismiss {
      position: absolute;
      top: -14px;
      right: -14px;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(80px);
      -webkit-backdrop-filter: blur(80px);
      border-radius: 24px;
      background: linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.12)), rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      cursor: pointer !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease, transform 0.15s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .wrap:hover .btn-dismiss {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer !important;
    }

    .btn-dismiss.always-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-dismiss-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      pointer-events: none;
    }

    .btn-dismiss svg {
      width: 11.5px;
      height: 11.5px;
      color: rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }

    .btn-dismiss:hover { transform: scale(1.05); }
    .btn-dismiss:active { transform: scale(0.95); }
    body.platform-darwin .btn-dismiss { left: -14px; right: auto; }

    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      overflow: hidden;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .bar { width: 0; height: 100%; background: var(--progress); transition: width 100ms linear; }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="btn-dismiss" aria-label="Dismiss" onclick="closeNotification(event)">
      <div class="btn-dismiss-icon">
        <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </div>
    </button>

    <div class="card">
      <div class="logo" aria-label="Fireflies logo"></div>
      <div class="content">
        <div class="title" id="title">Meeting is starting</div>
        <div class="time" id="timeLabel"></div>

        <div class="actions">
          <div class="split" id="split">
            <button class="primary" id="primaryBtn">
              <span class="icon" id="primaryIcon"></span>
              <span id="primaryText">Join Meeting</span>
            </button>
            <button class="menu-toggle" id="menuToggle" aria-label="More actions">
              <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="menu hidden" id="menu">
            <button class="menu-item" id="menuItem">
              <span class="icon" id="menuIcon"></span>
              <span id="menuText">Join and Invite Bot</span>
            </button>
          </div>
        </div>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
  </div>

          timer = null;
          bar.style.width = '100%';
          setTimeout(function () { closeNotification(null, false); }, 100);
          return;
        }
        bar.style.width = pct + '%';
      }, STEP);
    }

    function playNotificationSound(soundUrl) {
      if (!soundUrl) return;
      const audio = new Audio(soundUrl);
      audio.volume = 0.8;
      audio.play().catch(function () {
        // Some environments block autoplay; the notification should still render.
      });
    }

    function act(url) {
      pause();
      elapsed = TOTAL;
      if (url && window.electron && window.electron.notification) {
        window.electron.notification.action(url);
      } else {
        closeNotification();
      }
    }

    function closeMenu() { menu.classList.add('hidden'); }

    function closeNotification(event, isUserDismiss) {
      if (isUserDismiss === undefined) isUserDismiss = true;
      if (event) {
        event.stopPropagation();
        event.preventDefault();
      }
      pause();
      elapsed = TOTAL;
      const card = document.querySelector('.card');
      card.style.opacity = '0';
      card.style.transform = 'translateY(-10px)';
      setTimeout(function () {
        if (window.electron && window.electron.notification) {
          window.electron.notification.close(isUserDismiss ? dismissUrl : null);
        }
      }, 150);
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const meetingName = params.get('meetingName') || 'Meeting';
      const timeLabel = params.get('timeLabel') || '';
      const primaryText = params.get('primaryText') || 'Join Meeting';
      const primaryIcon = params.get('primaryIcon') || '';
      const menuText = params.get('menuText') || '';
      const menuIcon = params.get('menuIcon') || '';
      const soundUrl = params.get('soundUrl') || '';

      primaryUrl = params.get('primaryUrl') || '';
      menuUrl = params.get('menuUrl') || '';
      dismissUrl = primaryUrl || menuUrl || '';

      document.getElementById('title').textContent = '\u2018' + meetingName + '\u2019 is starting';
      document.getElementById('timeLabel').textContent = timeLabel;
      document.getElementById('primaryText').textContent = primaryText;
      document.getElementById('menuText').textContent = menuText || 'Join and Invite Bot';

      setIcon(document.getElementById('primaryIcon'), primaryIcon, 'mic');
      setIcon(document.getElementById('menuIcon'), menuIcon || primaryIcon, 'plus');

      if (!menuUrl) {
        menuToggle.classList.add('hidden');
      }

      primaryBtn.addEventListener('click', function () { act(primaryUrl); });
      menuToggle.addEventListener('click', function (event) {
        event.stopPropagation();
        menu.classList.toggle('hidden');
      });
      menuItem.addEventListener('click', function () { act(menuUrl); });

      [primaryBtn, menuToggle, menuItem].forEach(function (el) {
        el.addEventListener('mouseenter', pause);
        el.addEventListener('mouseleave', resume);
      });

      document.addEventListener('click', closeMenu);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeNotification();
        if (event.key === 'Enter' && primaryUrl) act(primaryUrl);
      });

      document.addEventListener('mouseenter', function () {
        if (window.electron && window.electron.notification) {
          window.electron.notification.focus();
        }
      });

      const platform = params.get('platform');
      if (platform) {
        document.body.classList.add('platform-' + platform);
      }

      if (PERSISTENT) {
        const pc = document.querySelector('.progress');
        if (pc) pc.style.display = 'none';
      }

      playNotificationSound(soundUrl);
      if (PERSISTENT) {
        const prog = document.querySelector('.progress');
        if (prog) prog.style.display = 'none';
        const dismiss = document.querySelector('.btn-dismiss');
        if (dismiss) dismiss.classList.add('always-visible');
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
