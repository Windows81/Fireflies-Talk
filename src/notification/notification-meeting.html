<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <style>
        /* Use system fonts only - faster loading, no font flashing */
        :root {
            --font-stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --bg-color: rgba(255, 255, 255, 0.95);
            --text-primary: #000;
            --text-secondary: #667085;
            --text-tertiary: #98a2b3;
            --border-color: rgba(0, 0, 0, 0.08);
            --button-primary: #6938ef;
            --button-hover: #5a2dd1;
            --button-secondary-bg: rgba(17, 24, 39, 0.06);
            --button-secondary-hover: rgba(17, 24, 39, 0.12);
            --button-secondary-border: rgba(0, 0, 0, 0.08);
            --button-secondary-text: #111827;
            --close-bg: rgba(0, 0, 0, 0.1);
            --close-hover: rgba(0, 0, 0, 0.2);
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: rgba(50, 50, 50, 1);
                --text-primary: #fff;
                --text-secondary: #a0a0a0;
                --text-tertiary: #8a8a8a;
                --border-color: rgba(255, 255, 255, 0.1);
                --button-secondary-bg: rgba(255, 255, 255, 0.08);
                --button-secondary-hover: rgba(255, 255, 255, 0.14);
                --button-secondary-border: rgba(255, 255, 255, 0.12);
                --button-secondary-text: #ffffff;
                --close-bg: rgba(255, 255, 255, 0.1);
                --close-hover: rgba(255, 255, 255, 0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-stack);
            line-height: 1.4;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            padding: 16px 17px 80px 15px;
        }

        body.single-action {
            padding: 16px 17px 78px 15px;
        }

        body.single-action .notification-wrapper,
        body.single-action .capture {
            height: 86px;
        }

        button {
            cursor: pointer !important;
        }

        .notification-wrapper {
            width: 406px;
            height: 120px;
            position: relative;
        }

        .capture {
            width: 406px;
            height: 120px;
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            background: var(--bg-color);
            display: flex;
            align-items: flex-start;
            padding: 14px 14px;
            gap: 12px;
            color: var(--text-primary);
            transform: translateZ(0);
            will-change: transform, opacity;
            animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35),
                        0 1px 3px rgba(0, 0, 0, 0.25);
            overflow: visible;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        .logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='19.299' y1='19.815' x2='-13.867' y2='-15.031' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='19.413' y1='19.707' x2='-13.752' y2='-15.139' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23FF3C82'/%3E%3Cstop offset='0.103' stop-color='%23F53E88'/%3E%3Cstop offset='0.274' stop-color='%23DC4598'/%3E%3Cstop offset='0.492' stop-color='%23B251B2'/%3E%3Cstop offset='0.745' stop-color='%237961D7'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='c' x1='24.923' y1='14.466' x2='13.685' y2='-26.259' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='d' x1='13.863' y1='24.989' x2='-26.367' y2='12.733' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23a)' d='M7.89 0H0v7.832h7.89V0Z'/%3E%3Cpath fill='url(%23b)' d='M17.236 9.455h-7.89v7.832h7.89V9.455Z'/%3E%3Cpath fill='url(%23c)' d='M17.236 0h-7.89v7.832H24v-1.12c0-1.78-.713-3.487-1.981-4.746A6.788 6.788 0 0 0 17.237 0h-.001Z'/%3E%3Cpath fill='url(%23d)' d='M0 9.455v7.832c0 1.78.713 3.488 1.981 4.747A6.789 6.789 0 0 0 6.763 24H7.89V9.455H0Z'/%3E%3C/svg%3E");
            background-size: 24px 24px;
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 2px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .title-icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .title-icon svg {
            width: 16px;
            height: 16px;
        }

        .body {
            font-size: 13px;
            line-height: 18px;
            color: var(--text-secondary);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .capture.single-action {
            align-items: center;
        }

        .capture.single-action .logo {
            margin-top: 0;
        }

        .capture.single-action .content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: auto auto;
            column-gap: 12px;
            row-gap: 6px;
        }

        .capture.single-action .title-row {
            grid-column: 1;
            grid-row: 1;
        }

        .capture.single-action .body {
            grid-column: 1;
            grid-row: 2;
        }

        .capture.single-action .actions {
            grid-column: 2;
            grid-row: 1 / span 2;
            margin-top: 0;
            justify-content: flex-end;
        }

        .btn {
            height: 36px;
            padding: 0 12px;
            border: none;
            border-radius: 4px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer !important;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
            position: relative;
            z-index: 2;
        }

        .btn[data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            max-width: 260px;
            width: max-content;
            padding: 8px;
            border-radius: 4px;
            background: linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.12)), rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: -0.1px;
            white-space: pre-line;
            text-align: left;
            box-shadow: 0px 2px 2px rgba(16, 24, 40, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.12s ease, transform 0.12s ease;
            pointer-events: none;
            z-index: 20;
        }


        .btn[data-tooltip-align="right"]::after {
            left: auto;
            right: 0;
        }

        .btn[data-tooltip]:hover::after,
        .btn[data-tooltip]:focus-visible::after {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--button-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--button-secondary-bg);
            border: 1px solid var(--button-secondary-border);
            color: var(--button-secondary-text);
        }

        .btn-secondary:hover {
            background: var(--button-secondary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-icon svg {
            width: 14px;
            height: 14px;
        }

        .or-text {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
        }

        .hidden {
            display: none !important;
        }

        .btn-dismiss {
            position: absolute;
            top: -14px;
            right: -14px;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            border-radius: 24px;
            background: linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.12)), rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            cursor: pointer !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease, transform 0.15s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .notification-wrapper:hover .btn-dismiss {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer !important;
        }

        .btn-dismiss.always-visible {
            opacity: 1;
            pointer-events: auto;
        }


        .btn-dismiss-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            pointer-events: none;
        }

        .btn-dismiss svg {
            width: 11.5px;
            height: 11.5px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
        }

        .btn-dismiss:hover {
            transform: scale(1.05);
        }

        .btn-dismiss:active {
            transform: scale(0.95);
        }

        body.platform-darwin .btn-dismiss {
            right: auto;
            left: -14px;
        }

        /* Clip wrapper keeps progress bar within capture's border-radius
           while capture itself stays overflow:visible for tooltips */
        .progress-clip {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            border-radius: 12px;
            pointer-events: none;
            z-index: 1;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: #6ce9a6;
            transition: width 100ms linear;
        }

        /* Full-component green progress overlay — disabled
        .progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0;
            background: rgba(106, 233, 166, 0.07);
            border-radius: 12px 0 0 12px;
            pointer-events: none;
            z-index: 1;
            transition: width 100ms linear;
        }

        .progress-overlay.full-width {
            border-radius: 12px;
        }
        */

        @media (prefers-reduced-motion: reduce) {
            .capture {
                animation: none;
            }
            .btn {
                transition: none;
            }
            .btn[data-tooltip]::after {
                transition: none;
            }
            .progress-bar {
                transition: none;
            }
            /* .progress-overlay {
                transition: none;
            } */
        }
    </style>
</head>
<body>
    <div class="notification-wrapper">
        <button class="btn-dismiss" aria-label="Dismiss" onclick="closeNotification(event)">
            <div class="btn-dismiss-icon">
                <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                </svg>
            </div>
        </button>

        <div class="capture">
            <!-- <div class="progress-overlay" id="progressOverlay"></div> -->
            <div class="logo" role="img" aria-label="Fireflies logo"></div>

            <div class="content">
                <div class="title-row">
                    <div class="title" id="title">Meeting is live</div>
                    <div class="title-icon" id="titleIcon"></div>
                </div>
                <div class="body" id="body">Capture notes and get live suggestions.</div>
                <div class="actions" id="actions">
                    <button class="btn btn-primary" id="primaryBtn"
                            data-tooltip="Invite Fireflies bot. Joins your meeting. Visible to all participants." data-tooltip-align="left">
                        <span class="btn-icon" id="primaryIcon"></span>
                        <span id="primaryText">Invite Notetaker</span>
                    </button>
                    <span class="or-text" id="orText">OR</span>
                    <button class="btn btn-secondary" id="secondaryBtn"
                            data-tooltip="Listens via system audio. No Audio/Video recording & Speaker labels." data-tooltip-align="right">
                        <span class="btn-icon" id="secondaryIcon"></span>
                        <span id="secondaryText">Record</span>
                    </button>
                </div>
            </div>

            <div class="progress-clip">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>
    </div>

        function setIcon(element, key) {
            if (!element) return;
            if (!key || !ICONS[key]) {
                element.classList.add('hidden');
                return;
            }
            element.innerHTML = ICONS[key];
            element.classList.remove('hidden');
        }

        (function init() {
            const params = new URLSearchParams(window.location.search);

            const title = params.get('title');
            const body = params.get('body');
            const primaryText = params.get('primaryText') || 'Action';
            const primaryIcon = params.get('primaryIcon');
            primaryUrl = params.get('primaryUrl') || '';

            const secondaryText = params.get('secondaryText');
            const secondaryIcon = params.get('secondaryIcon');
            secondaryUrl = params.get('secondaryUrl') || '';

            const titleIcon = params.get('titleIcon');
            const orText = params.get('orText') || 'OR';

            if (title) document.getElementById('title').textContent = title;
            if (body) document.getElementById('body').textContent = body;

            document.getElementById('primaryText').textContent = primaryText;
            document.getElementById('orText').textContent = orText;

            setIcon(document.getElementById('titleIcon'), titleIcon);
            setIcon(document.getElementById('primaryIcon'), primaryIcon);
            setIcon(document.getElementById('secondaryIcon'), secondaryIcon);

            const secondaryBtn = document.getElementById('secondaryBtn');
            const orTextEl = document.getElementById('orText');
            const secondaryTextEl = document.getElementById('secondaryText');
            const captureEl = document.querySelector('.capture');

            if (secondaryText && secondaryUrl) {
                secondaryTextEl.textContent = secondaryText;
            } else {
                secondaryBtn.classList.add('hidden');
                orTextEl.classList.add('hidden');
                document.body.classList.add('single-action');
                if (captureEl) {
                    captureEl.classList.add('single-action');
                }
                // Align primary tooltip to right when it's the only button
                const primaryBtn = document.getElementById('primaryBtn');
                if (primaryBtn) {
                    primaryBtn.setAttribute('data-tooltip-align', 'right');
                }
            }

            dismissUrl = primaryUrl || secondaryUrl || '';

            const platform = params.get('platform');
            if (platform) {
                document.body.classList.add('platform-' + platform);
            }

            const primaryBtn = document.getElementById('primaryBtn');
            primaryBtn.addEventListener('click', () => {
                handleAction(primaryUrl);
            });

            secondaryBtn.addEventListener('click', () => {
                handleAction(secondaryUrl);
            });

            // Pause progress on button hover
            [primaryBtn, secondaryBtn].forEach(btn => {
                btn.addEventListener('mouseenter', pauseProgress);
                btn.addEventListener('mouseleave', resumeProgress);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeNotification();
                if (e.key === 'Enter' && primaryUrl) handleAction(primaryUrl);
            });

            document.addEventListener('mouseenter', () => {
                if (window.electron?.notification) {
                    window.electron.notification.focus();
                }
            });

            if (PERSISTENT) {
                const pc = document.querySelector('.progress-container');
                if (pc) pc.style.display = 'none';
                const dismiss = document.querySelector('.btn-dismiss');
                if (dismiss) dismiss.classList.add('always-visible');
            }
            startProgress();
        })();

        function startProgress() {
            if (PERSISTENT) return;
            const progressBar = document.getElementById('progressBar');
            // const progressOverlay = document.getElementById('progressOverlay');

            progressInterval = setInterval(() => {
                elapsedTime += UPDATE_INTERVAL;
                const progress = (elapsedTime / TOTAL_DURATION) * 100;

                if (progress >= 100) {
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';
                    // progressOverlay.style.width = '100%';
                    // progressOverlay.classList.add('full-width');
                    setTimeout(() => {
                        closeNotification(null, false);
                    }, 100);
                } else {
                    progressBar.style.width = progress + '%';
                    // progressOverlay.style.width = progress + '%';
                    // if (progress > 98) {
                    //     progressOverlay.classList.add('full-width');
                    // }
                }
            }, UPDATE_INTERVAL);
        }

        function pauseProgress() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function resumeProgress() {
            if (PERSISTENT) return;
            if (!progressInterval && elapsedTime < TOTAL_DURATION) {
                startProgress();
            }
        }

        function stopProgress() {
            pauseProgress();
            elapsedTime = TOTAL_DURATION;
        }

        function handleAction(url) {
            stopProgress();
            if (url && window.electron?.notification) {
                window.electron.notification.action(url);
            } else {
                closeNotification();
            }
        }

        function closeNotification(event, isUserDismiss = true) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            stopProgress();

            const capture = document.querySelector('.capture');
            capture.style.opacity = '0';
            capture.style.transform = 'translateY(-10px)';

            setTimeout(() => {
                if (window.electron?.notification) {
                    window.electron.notification.close(isUserDismiss ? dismissUrl : null);
                }
            }, 150);
        }
    </script>
