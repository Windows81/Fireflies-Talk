<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <style>
        :root {
            --font-stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --bg-color: rgba(50, 50, 50, 1);
            --text-primary: #fff;
            --text-secondary: #a0a0a0;
            --border-color: rgba(255, 255, 255, 0.1);
            --button-primary: #6938ef;
            --button-hover: #5a2dd1;
            --close-bg: rgba(255, 255, 255, 0.1);
            --close-hover: rgba(255, 255, 255, 0.2);
            --progress-color: #6ce9a6;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: rgba(255, 255, 255, 0.95);
                --text-primary: #000;
                --text-secondary: #667085;
                --border-color: rgba(0, 0, 0, 0.08);
                --close-bg: rgba(0, 0, 0, 0.1);
                --close-hover: rgba(0, 0, 0, 0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-stack);
            line-height: 1.4;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            padding: 16px 17px 18px 15px;
        }

        button {
            cursor: pointer !important;
        }

        .notification-wrapper {
            width: 406px;
            height: 118px;
            position: relative;
        }

        .capture {
            width: 406px;
            height: 118px;
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            background: var(--bg-color);
            display: flex;
            align-items: flex-start;
            padding: 12px 14px;
            gap: 12px;
            color: var(--text-primary);
            transform: translateZ(0);
            will-change: transform, opacity;
            animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35),
                        0 1px 3px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        .logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='19.299' y1='19.815' x2='-13.867' y2='-15.031' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='19.413' y1='19.707' x2='-13.752' y2='-15.139' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23FF3C82'/%3E%3Cstop offset='0.103' stop-color='%23F53E88'/%3E%3Cstop offset='0.274' stop-color='%23DC4598'/%3E%3Cstop offset='0.492' stop-color='%23B251B2'/%3E%3Cstop offset='0.745' stop-color='%237961D7'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='c' x1='24.923' y1='14.466' x2='13.685' y2='-26.259' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='d' x1='13.863' y1='24.989' x2='-26.367' y2='12.733' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23E82A73'/%3E%3Cstop offset='0.113' stop-color='%23DE2D7A'/%3E%3Cstop offset='0.3' stop-color='%23C5388F'/%3E%3Cstop offset='0.54' stop-color='%239B4AB0'/%3E%3Cstop offset='0.818' stop-color='%236262DE'/%3E%3Cstop offset='0.994' stop-color='%233B73FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23a)' d='M7.89 0H0v7.832h7.89V0Z'/%3E%3Cpath fill='url(%23b)' d='M17.236 9.455h-7.89v7.832h7.89V9.455Z'/%3E%3Cpath fill='url(%23c)' d='M17.236 0h-7.89v7.832H24v-1.12c0-1.78-.713-3.487-1.981-4.746A6.788 6.788 0 0 0 17.237 0h-.001Z'/%3E%3Cpath fill='url(%23d)' d='M0 9.455v7.832c0 1.78.713 3.488 1.981 4.747A6.789 6.789 0 0 0 6.763 24H7.89V9.455H0Z'/%3E%3C/svg%3E");
            background-size: 24px 24px;
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 2px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            position: relative;
            z-index: 2;
        }

        .title-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            min-width: 0;
        }

        .meeting-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
            margin-top: 3px;
        }

        .title-suffix {
            font-size: 14px;
            font-weight: 400;
            line-height: 20px;
            color: var(--text-primary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .body-text {
            font-size: 13px;
            line-height: 18px;
            color: var(--text-secondary);
        }

        .skip-link {
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer !important;
            background: none;
            border: none;
            font-size: 13px;
            line-height: 18px;
            font-family: var(--font-stack);
            padding: 0;
            display: inline;
        }

        .skip-link:hover {
            color: var(--text-primary);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn {
            height: 32px;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer !important;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
            position: relative;
            z-index: 2;
        }

        .btn-primary {
            background: var(--button-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        .btn-dismiss {
            position: absolute;
            top: -14px;
            right: -14px;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            border-radius: 24px;
            background: linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.12)), rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            cursor: pointer !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease, transform 0.15s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .notification-wrapper:hover .btn-dismiss {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer !important;
        }

        .btn-dismiss.always-visible {
            opacity: 1;
            pointer-events: auto;
        }


        .btn-dismiss-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            pointer-events: none;
        }

        .btn-dismiss svg {
            width: 11.5px;
            height: 11.5px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
        }

        .btn-dismiss:hover {
            transform: scale(1.05);
        }

        .btn-dismiss:active {
            transform: scale(0.95);
        }

        body.platform-darwin .btn-dismiss {
            right: auto;
            left: -14px;
        }

        /* Progress bar at bottom */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            overflow: hidden;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 3;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--progress-color);
            transition: width 100ms linear;
        }

        /* Full-component green progress overlay — disabled
        .progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0;
            background: rgba(106, 233, 166, 0.07);
            border-radius: 12px 0 0 12px;
            pointer-events: none;
            z-index: 1;
            transition: width 100ms linear;
        }

        .progress-overlay.full-width {
            border-radius: 12px;
        }
        */

        @media (prefers-reduced-motion: reduce) {
            .capture {
                animation: none;
            }
            .btn {
                transition: none;
            }
            .progress-bar {
                transition: none;
            }
            /* .progress-overlay {
                transition: none;
            } */
        }
    </style>
</head>
<body>
    <div class="notification-wrapper">
        <button class="btn-dismiss" aria-label="Dismiss" onclick="closeNotification(event)">
            <div class="btn-dismiss-icon">
                <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                </svg>
            </div>
        </button>

        <div class="capture">
            <!-- <div class="progress-overlay" id="progressOverlay"></div> -->

            <div class="logo" role="img" aria-label="Fireflies logo"></div>

            <div class="content">
                <div class="title-row">
                    <span class="meeting-name" id="meetingName">'Meeting'</span>
                    <span class="meeting-name">starts in 15 mins</span>
                </div>
                <div class="body-text" id="bodyText">
                    <span id="bodyMessage">Notetaker will auto-join meeting.</span>
                    <button class="skip-link" id="skipLink" onclick="handleSkipAutoJoin()">Skip auto-join</button>
                </div>
                <div class="actions" id="actions">
                    <button class="btn btn-primary" id="actionBtn">View Meeting Prep</button>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        let progressInterval = null;
        const _upcomingParams = new URLSearchParams(window.location.search);
        const _upcomingTimeout = _upcomingParams.has('timeout') ? parseInt(_upcomingParams.get('timeout'), 10) : 15000;
        const TOTAL_DURATION = _upcomingTimeout;
        const PERSISTENT = TOTAL_DURATION === 0;
        const UPDATE_INTERVAL = 100;
        let elapsedTime = 0;

        // State
        let eventId = '';
        let iCalUID = '';
        let calendarType = '';
        let hasMeetingPrep = false;
        let hasAutoJoin = false;
        let prepUrl = '';
        let dismissUrl = '';

        (function init() {
            const params = new URLSearchParams(window.location.search);

            const meetingName = params.get('meetingName') || 'Meeting';
            eventId = params.get('eventId') || '';
            iCalUID = params.get('iCalUID') || '';
            calendarType = params.get('calendarType') || '';
            hasMeetingPrep = params.get('hasMeetingPrep') === 'true';
            hasAutoJoin = params.get('hasAutoJoin') === 'true';
            prepUrl = params.get('prepUrl') || '';

            // Set meeting name with quotes
            document.getElementById('meetingName').textContent = '\u2018' + meetingName + '\u2019';

            // Configure UI based on state
            const bodyMessage = document.getElementById('bodyMessage');
            const skipLink = document.getElementById('skipLink');
            const actionBtn = document.getElementById('actionBtn');
            const actionsDiv = document.getElementById('actions');

            if (hasMeetingPrep && hasAutoJoin) {
                // State A: Both prep + auto-join
                bodyMessage.textContent = 'Notetaker will auto-join meeting. ';
                skipLink.classList.remove('hidden');
                actionBtn.textContent = 'View Meeting Prep';
                actionBtn.onclick = function() { handleViewMeetingPrep(); };
                dismissUrl = prepUrl || eventId;
            } else if (hasAutoJoin && !hasMeetingPrep) {
                // State B: Only auto-join
                bodyMessage.textContent = 'Notetaker will auto-join meeting.';
                skipLink.classList.add('hidden');
                actionBtn.textContent = 'Skip Auto-Join';
                actionBtn.onclick = function() { handleSkipAutoJoin(); };
                dismissUrl = eventId;
            } else if (hasMeetingPrep && !hasAutoJoin) {
                // State C: Only prep
                bodyMessage.textContent = 'Prepare for your meeting.';
                skipLink.classList.add('hidden');
                actionBtn.textContent = 'View Meeting Prep';
                actionBtn.onclick = function() { handleViewMeetingPrep(); };
                dismissUrl = prepUrl || eventId;
            }

            // Platform
            const platform = params.get('platform');
            if (platform) {
                document.body.classList.add('platform-' + platform);
            }

            // Pause progress on button hover
            [actionBtn, skipLink].forEach(function(btn) {
                btn.addEventListener('mouseenter', pauseProgress);
                btn.addEventListener('mouseleave', resumeProgress);
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeNotification();
            });

            // Focus on mouseenter
            document.addEventListener('mouseenter', function() {
                if (window.electron && window.electron.notification) {
                    window.electron.notification.focus();
                }
            });

            if (PERSISTENT) {
                const pc = document.querySelector('.progress-container');
                if (pc) pc.style.display = 'none';
                const dismiss = document.querySelector('.btn-dismiss');
                if (dismiss) dismiss.classList.add('always-visible');
            }
            startProgress();
        })();

        function startProgress() {
            if (PERSISTENT) return;
            const progressBar = document.getElementById('progressBar');
            // const progressOverlay = document.getElementById('progressOverlay');

            progressInterval = setInterval(function() {
                elapsedTime += UPDATE_INTERVAL;
                const progress = (elapsedTime / TOTAL_DURATION) * 100;

                if (progress >= 100) {
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';
                    // progressOverlay.style.width = '100%';
                    // progressOverlay.classList.add('full-width');
                    setTimeout(function() {
                        closeNotification(null, false);
                    }, 100);
                } else {
                    progressBar.style.width = progress + '%';
                    // progressOverlay.style.width = progress + '%';
                    // if (progress > 98) {
                    //     progressOverlay.classList.add('full-width');
                    // }
                }
            }, UPDATE_INTERVAL);
        }

        function pauseProgress() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function resumeProgress() {
            if (PERSISTENT) return;
            if (!progressInterval && elapsedTime < TOTAL_DURATION) {
                startProgress();
            }
        }

        function stopProgress() {
            pauseProgress();
            elapsedTime = TOTAL_DURATION;
        }

        function handleViewMeetingPrep() {
            stopProgress();
            var url = prepUrl || '/meeting-prep?eventId=' + encodeURIComponent(eventId);
            if (window.electron && window.electron.notification) {
                window.electron.notification.action(url);
            } else {
                closeNotification();
            }
        }

        function handleSkipAutoJoin() {
            // Build skip URL with necessary params
            var url = '/skip-auto-join?eventId=' + encodeURIComponent(eventId);
            if (iCalUID) {
                url += '&iCalUID=' + encodeURIComponent(iCalUID);
            }
            if (calendarType) {
                url += '&calendarType=' + encodeURIComponent(calendarType);
            }
            url += '&hasMeetingPrep=' + (hasMeetingPrep ? 'true' : 'false');

            if (window.electron && window.electron.notification) {
                window.electron.notification.action(url);
            }
            // Don't close — main process decides what to do
        }

        /**
         * Called by main process via executeJavaScript when skip-auto-join is clicked
         * and meeting prep is available. Transitions to prep-only state.
         */
        function switchToMeetingPrepOnly() {
            var bodyMessage = document.getElementById('bodyMessage');
            var skipLink = document.getElementById('skipLink');
            var actionBtn = document.getElementById('actionBtn');

            bodyMessage.textContent = 'Prepare for your meeting.';
            skipLink.classList.add('hidden');
            actionBtn.textContent = 'View Meeting Prep';
            actionBtn.onclick = function() { handleViewMeetingPrep(); };

            // Update state
            hasAutoJoin = false;
        }

        function closeNotification(event, isUserDismiss) {
            if (isUserDismiss === undefined) isUserDismiss = true;
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            stopProgress();

            var capture = document.querySelector('.capture');
            capture.style.opacity = '0';
            capture.style.transform = 'translateY(-10px)';

            setTimeout(function() {
                if (window.electron && window.electron.notification) {
                    window.electron.notification.close(isUserDismiss ? dismissUrl : null);
                }
            }, 150);
        }
    </script>
</body>
</html>
